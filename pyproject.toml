[project]
name = "card-print-middleware"
version = "0.3.0"
description = "CarnetPrint: generador e impresor de carnets para la Entrust Sigma DS3 (API FastAPI + web)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pydantic-settings>=2.4",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
