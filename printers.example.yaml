# Copiar a printers.yaml y ajustar. `queue` = nombre de la cola CUPS (lpstat -p).
# `allowed_options` = whitelist {opcion_CUPS: [valores permitidos]} que la webapp puede pedir
# (se envía como `lp -o clave=valor`). Lista vacía = cualquier valor.
# Opciones del ZC300 extraídas del PPD oficial de Zebra (driver Mac 1.0.10.0);
# para verificar en el equipo: lpoptions -p <queue> -l
printers:
  - id: zebra-zc300
    label: Zebra ZC300
    adapter: cups
    queue: Zebra_ZC300
    allowed_options:
      CardSource: [0Manual, 1Feeder, 3Auto, 2InPrinter]
      CardDestination: [0Hopper, 1Reject, 2InPrinter]
      PageSize: [CR80, CR81, CR82]
      DualSidePrinting: [0false, 1true]
      Orientation: [0Landscape, 1Portrait]
      Rotation: [0None, 1Front, 2Back, 3Both]
      PrintFrontimageOnBackSide: [0no, 1yes]
      RibbonName: [0YMCKO, 1YMCKOK, 2HalfYMCKO, 3HalfYMCKOKO, 4YMCPKO, 5KdO, 6KrO, 7Black, 8White, 9Red, 10Blue, 11Gold, 12Silver, 13YMCKLL, 14SDYMCKO, 15Hologram]
      RibbonCombination: [0FrontYmcko, 1FrontYmckoBackYmcko, 2FrontYmcoBackK, 4FrontYmckoBackK, 5FrontYmckoBackKo, 6FrontYmckll, 7FrontYmckllBackYmckll, 8FrontYmclBackKl, 9FrontYmcpko, 10FrontYmcpkoBackYmcpko, 11FrontYmcpoBackK, 12FrontMono, 13FrontMonoBackMono, 14FrontKrO, 15FrontKrOBackKrO, 16FrontKdO, 17FrontKdOBackKdO, 18FrontYmcllBackK, 19FrontSrDYmcko, 20FrontSrDYmcoBackK, 21FrontSrDYmckoBackSrdYmcko, 22FrontO, 23FrontOBackO, 24BackYmcko, 25BackYmckoFrontYmcko, 26BackYmcoFrontK, 28BackYmckoFrontK, 29BackYmckoFrontKo, 30BackYmckll, 31BackYmckllFrontYmckll, 32BackYmclFrontKl, 33BackYmcpko, 34BackYmcpkoFrontYmcpko, 35BackYmcpoFrontK, 36BackMono, 37BackMonoFrontMono, 38BackKrO, 39BackKrOFrontKrO, 40BackKdO, 41BackKdOFrontKdO, 42BackYmcllFrontK, 43BackSrDYmcko, 44BackSrDYmcoFrontK, 45BackSrDYmckoFrontSrdYmcko, 46BackO, 47BackOFrontO]
      DisableMagEncoding: [0no, 1yes]

  - id: entrust-sigma-ds3
    label: Entrust Sigma DS3
    adapter: cups
    queue: Entrust_Sigma_DS3
    allowed_options: {}   # pendiente: driver/PPD de Entrust

  # Solo para desarrollo sin hardware:
  # - id: mock
  #   label: Mock
  #   adapter: mock
