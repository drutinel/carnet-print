name: Build CarnetPrint.exe

# Compila CarnetPrint.exe (+ bridge\) en un Windows real. PyInstaller no compila para otro sistema.
#  - Push a main:      compila, prueba y publica un Release solo, con la versión vX.Y.<n° de ejecución>
#                      (X.Y salen de `version` en pyproject.toml). Si el mensaje del commit lleva
#                      [skip release], compila y prueba sin publicar. Los cambios solo de docs no disparan nada.
#  - Etiqueta v*:      publica un Release con ese nombre   (git tag v1.0.0 && git push origin v1.0.0)
#  - Pull request:     compila y prueba, sin publicar
#  - Manual:           Actions > Build CarnetPrint.exe > Run workflow  (el resultado queda como artefacto)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "**.txt", "docs/**", ".gitignore"]

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:REF_TYPE -eq "tag") { $v = $env:REF_NAME }
          elseif ($env:EVENT -eq "push") {
            $m = Select-String -Path pyproject.toml -Pattern '^version = "(\d+)\.(\d+)\.\d+"'
            if (-not $m) { throw "No encontré version = ""X.Y.Z"" en pyproject.toml" }
            $v = "v$($m.Matches[0].Groups[1].Value).$($m.Matches[0].Groups[2].Value).$env:RUN_NUMBER"
          }
          else { $v = "dev-" + $env:SHA.Substring(0, 7) }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Versión: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Compilar (puente .NET + PyInstaller)
        shell: pwsh
        run: ./build-exe.ps1

      - name: Probar que el .exe arranca y sirve la web
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist\* $dir -Recurse
          $env:CARDPRINT_OPEN_BROWSER = "false"
          $p = Start-Process (Join-Path $dir "CarnetPrint.exe") -WorkingDirectory $dir -PassThru `
                 -RedirectStandardOutput (Join-Path $dir "out.log") -RedirectStandardError (Join-Path $dir "err.log")
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try { if ((Invoke-WebRequest http://127.0.0.1:8787/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            }
            if (-not $ok) { throw "CarnetPrint.exe no respondió en /health" }
            $ui = Invoke-WebRequest http://127.0.0.1:8787/ui/generador-carnets.html -UseBasicParsing
            if ($ui.StatusCode -ne 200 -or $ui.Content -notmatch "Generador de carnets") { throw "La web no va dentro del .exe" }
            foreach ($f in ".env", "printers.yaml") {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "No se creó $f junto al .exe" }
            }
            Write-Host "OK: /health, la web y los archivos de la primera ejecución"
          } finally {
            taskkill /F /T /PID $p.Id | Out-Null   # el .exe de PyInstaller lanza un proceso hijo
            Get-Content (Join-Path $dir "out.log"), (Join-Path $dir "err.log") -ErrorAction SilentlyContinue
          }

      - name: Instalador (Inno Setup, con .NET 8 Desktop Runtime incluido)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory installer\deps -Force | Out-Null
          $dep = "installer\deps\windowsdesktop-runtime-win-x64.exe"
          Invoke-WebRequest "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" -OutFile $dep
          $sig = Get-AuthenticodeSignature $dep
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "El instalador de .NET no tiene una firma válida de Microsoft ($($sig.Status))"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" } }
          $v = $env:VERSION.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }   # compilaciones dev-<sha>
          & $iscc "/DAppVersion=$v" installer\CarnetPrint.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló ($LASTEXITCODE)" }
          "INSTALLER=dist\CarnetPrint-Setup-$v.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Probar el instalador (instalación silenciosa)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "instalado"
          $log = Join-Path $env:RUNNER_TEMP "inno.log"
          $p = Start-Process $env:INSTALLER -Wait -PassThru -ArgumentList `
                 "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target", "/MERGETASKS=!entrustdriver,!desktopicon", "/LOG=$log"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "El instalador terminó con código $($p.ExitCode)" }
          foreach ($f in "CarnetPrint.exe", "bridge\CardBridge.exe") {
            if (-not (Test-Path (Join-Path $target $f))) { throw "El instalador no copió $f" }
          }
          Write-Host "OK: instalado en $target"

      - name: Armar el zip
        shell: pwsh
        run: |
          $name = "CarnetPrint-${{ steps.ver.outputs.version }}-win-x64"
          Compress-Archive -Path dist\CarnetPrint.exe, dist\bridge -DestinationPath "$name.zip"
          "ZIP_NAME=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: CarnetPrint-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CarnetPrint-Setup
          path: ${{ env.INSTALLER }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CarnetPrint.exe
          path: dist/CarnetPrint.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # Push a main (salvo [skip release]) o etiqueta v*: publica el zip y el .exe que armó el job anterior
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$VERSION" artifacts/CarnetPrint-Setup/*.exe artifacts/CarnetPrint-win-x64/*.zip artifacts/CarnetPrint.exe/CarnetPrint.exe \
            --target "$SHA" --title "CarnetPrint $VERSION" \
            --notes-file .github/release-notes.md --generate-notes
