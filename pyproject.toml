[project]
name = "card-print-middleware"
version = "0.1.0"
description = "Middleware Linux para imprimir carnets (Zebra ZC300, Entrust Sigma DS3) desde una webapp"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pydantic-settings>=2.4",
  "pillow>=10.3",
  "pypdfium2>=4.30; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
